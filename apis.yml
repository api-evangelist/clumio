aid: clumio
name: Clumio
description: >-
  Clumio (a Commvault company) is a secure, air-gapped backup-as-a-service platform for the public
  cloud. It delivers fully managed, immutable data protection and on-demand restore for Amazon Web
  Services (EBS, EC2, RDS, S3, DynamoDB, DocumentDB, Neptune, Iceberg tables, EC2/RDS MSSQL), Google
  Cloud Storage, and VMware vCenter workloads. Clumio is API-first: its regional REST API lets teams
  automate AWS/GCP connections, backup policies and protection rules, protection groups,
  organizational units, users and roles, compliance reports, audit trails, and restore workflows.
  Authentication uses long-lived signed-JWT bearer tokens (Personal and Service tokens), responses
  follow HATEOAS/HAL conventions with `_links`, and the API is versioned per resource. First-party
  Python and Go SDKs and a Terraform provider are published under the clumio-code GitHub org.
